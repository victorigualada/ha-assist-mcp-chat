name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Bug Fixes"
    labels: ["fix", "bug"]
  - title: "🎨 Frontend / UI"
    labels: ["frontend", "ui"]
  - title: "🧰 Maintenance"
    labels: ["chore", "refactor", "ci", "dependencies"]
  - title: "📝 Documentation"
    labels: ["documentation", "docs"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels: ["major", "breaking"]
  minor:
    labels: ["minor", "feature", "enhancement"]
  patch:
    labels: ["patch", "fix", "bug", "chore", "documentation"]
  default: patch

# Apply labels automatically so PRs land in the right category without manual work.
autolabeler:
  - label: "documentation"
    files: ["**/*.md"]
  - label: "frontend"
    files: ["frontend/**", "custom_components/assist_mcp_chat/frontend/**"]
  - label: "ci"
    files: [".github/**"]
  - label: "fix"
    title: ["/^fix(\\(.*\\))?:/i"]
  - label: "feature"
    title: ["/^feat(\\(.*\\))?:/i"]
  - label: "chore"
    title: ["/^(chore|refactor|build|style|test)(\\(.*\\))?:/i"]

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
